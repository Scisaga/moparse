<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1550" viewBox="0 0 1280 1550" role="img" aria-labelledby="title description" xml:space="preserve">
  <title id="title">MO-Parse 服务处理与解析研究边界</title>
  <desc id="description">接收任务并调用所选后端。解析研究止于原始解析、忠实导出和必要资产就绪；后续结果读取、表格与图形语义转换、页面清理、文档组装、验收和返回保存属于 MO-Parse 服务。候选解析管线不承担服务最终格式要求。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7394af"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#9aaab8"/></marker>
  </defs>
  <style>
    text { font-family: 'DejaVu Sans', 'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif; }
    .connector { fill: none; stroke: #7394af; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1280" height="1550" rx="20" fill="#ffffff"/>
  <text x="64.00" y="70" font-size="34" font-weight="700" fill="#17324d"><tspan font-family="DejaVu Sans, sans-serif">MO-Parse </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">服务处理目标</tspan></text>
  <text x="64.00" y="108" font-size="18" font-weight="400" fill="#52677b"><tspan font-family="Noto Sans CJK SC, sans-serif">解析后端提供原始结果；</tspan><tspan font-family="DejaVu Sans, sans-serif">MO-Parse </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">完成转换、清理与公开交付</tspan></text>
  <rect x="900" y="38" width="316" height="40" rx="20" fill="#eef5fb" stroke="#d6e6f2" stroke-width="1"/>
  <text x="953.02" y="64" font-size="16" font-weight="600" fill="#176da5"><tspan font-family="Noto Sans CJK SC, sans-serif">服务目标</tspan><tspan font-family="DejaVu Sans, sans-serif"> </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">·</tspan><tspan font-family="DejaVu Sans, sans-serif"> </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">现有</tspan><tspan font-family="Noto Sans CJK SC, sans-serif">实现</tspan><tspan font-family="Noto Sans CJK SC, sans-serif">尚未完成</tspan></text>
  <path class="connector" d="M 622 230 H 658" marker-end="url(#arrow)"/>
  <path class="connector" d="M 940 296 V 316 H 640 V 334" marker-end="url(#arrow)"/>
  <path class="connector" d="M 640 436 V 480" marker-end="url(#arrow)"/>
  <path class="connector" d="M 640 594 V 622"/>
