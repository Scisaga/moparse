<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1430" viewBox="0 0 1280 1430" role="img" aria-labelledby="title description" xml:space="preserve">
  <title id="title">MO-Parse 八步解析管线研究</title>
  <desc id="description">比较原始解析质量与实际解析成本。固定比较条件时先逐组明确原生输出和忠实读回，再按授权执行八条完整配置。分类别分析后决定固定方法或研究路由，调优后形成结论；服务适配、语义转换及最终格式不作为解析比较的前置条件。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7394af"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#9aaab8"/></marker>
  </defs>
  <style>
    text { font-family: 'DejaVu Sans', 'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif; }
    .connector { fill: none; stroke: #7394af; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1280" height="1430" rx="20" fill="#ffffff"/>
  <text x="64.00" y="70" font-size="34" font-weight="700" fill="#17324d"><tspan font-family="Noto Sans CJK SC, sans-serif">解析管线研究路线</tspan></text>
  <text x="64.00" y="108" font-size="18" font-weight="400" fill="#52677b"><tspan font-family="Noto Sans CJK SC, sans-serif">原件类别</tspan><tspan font-family="DejaVu Sans, sans-serif"> </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">→</tspan><tspan font-family="DejaVu Sans, sans-serif"> </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">固定对照</tspan><tspan font-family="DejaVu Sans, sans-serif"> </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">→</tspan><tspan font-family="DejaVu Sans, sans-serif"> </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">解析质量与成本</tspan><tspan font-family="DejaVu Sans, sans-serif"> </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">→</tspan><tspan font-family="DejaVu Sans, sans-serif"> </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">有证据的方法选择</tspan></text>
  <rect x="900" y="38" width="316" height="40" rx="20" fill="#eef5fb" stroke="#d6e6f2" stroke-width="1"/>
  <text x="961.38" y="64" font-size="16" font-weight="600" fill="#176da5"><tspan font-family="Noto Sans CJK SC, sans-serif">研究计划</tspan><tspan font-family="DejaVu Sans, sans-serif"> </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">·</tspan><tspan font-family="DejaVu Sans, sans-serif"> </tspan><tspan font-family="Noto Sans CJK SC, sans-serif">尚无新对照结果</tspan></text>
  <text x="829.00" y="137" font-size="14" font-weight="400" fill="#52677b"><tspan font-family="Noto Sans CJK SC, sans-serif">证据不足：补原件标注与比较条件</tspan></text>
