name: Publish Docker image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'docker-main' || format('docker-tag-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      short_sha: ${{ steps.revision.outputs.short_sha }}
    steps:
      - name: Resolve the verified source revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$VERIFIED_SHA"
          else
            sha="$CURRENT_SHA"
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "source revision must be a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Verify tag points to the revision that triggered the workflow
        if: github.event_name == 'push'
        env:
          TAG_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          default_branch=$(curl --fail --silent \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | \
            python -c 'import json, sys; print(json.load(sys.stdin)["default_branch"])')
          default_sha=$(git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/${default_branch}" | cut -f1)
          if [ "$TAG_SHA" != "$default_sha" ]; then
            echo "tag $TAG_NAME does not point to the current default branch head" >&2
            exit 1
          fi

      - name: Verify the successful CI revision is still the main head
        if: github.event_name == 'workflow_run'
        env:
          VERIFIED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          main_sha=$(git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/main | cut -f1)
          if [ "$VERIFIED_SHA" != "$main_sha" ]; then
            echo "verified revision is no longer the main branch head" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install uv and Python 3.13 for tag validation
        if: github.event_name != 'workflow_run'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.13"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify and install the Python lockfile
        if: github.event_name != 'workflow_run'
        run: |
          uv lock --check
          uv sync --frozen

      - name: Install Node 20 for tag validation
        if: github.event_name != 'workflow_run'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate tag source
        if: github.event_name != 'workflow_run'
        env:
          GLM_OCR_ENABLED: "0"
          DOCLING_MODEL_DOWNLOAD: "0"
          DATA_DIR: ${{ runner.temp }}/moparse-data
          STATIC_DIR: ${{ runner.temp }}/moparse-static
        run: |
          uv run ruff check app scripts tests
          uv run mypy app
          uv run pytest -m "not gpu"
          uv run python scripts/export_openapi.py --check
          uv run python scripts/generate_fixtures.py --check
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test
          npm --prefix frontend run build
          docker compose --profile glm config --quiet

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/scisaga/moparse
          labels: |
            org.opencontainers.image.source=https://github.com/Scisaga/moparse
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=sha-${{ steps.revision.outputs.short_sha }}

      - name: Build image for smoke testing
        run: |
          docker buildx build --load \
            --tag moparse:publish-candidate \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Smoke test image startup
        run: |
          docker run --detach --name moparse-smoke \
            --env DOCLING_MODEL_DOWNLOAD=0 \
            --env GLM_OCR_ENABLED=0 \
            --publish 127.0.0.1:12303:12303 \
            moparse:publish-candidate
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:12303/health >/dev/null; then
              docker exec moparse-smoke ffmpeg -version >/dev/null
              docker exec moparse-smoke ffprobe -version >/dev/null
              exit 0
            fi
            echo "health check attempt ${attempt}/60 did not succeed yet"
            sleep 2
          done
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: |
          docker logs moparse-smoke || true
          docker rm --force moparse-smoke || true

      - name: Recheck main immediately before publishing mutable tags
        if: github.event_name == 'workflow_run'
        env:
          VERIFIED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          main_sha=$(git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/main | cut -f1)
          if [ "$VERIFIED_SHA" != "$main_sha" ]; then
            echo "main advanced while the candidate image was being tested" >&2
            exit 1
          fi

      - name: Push verified image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  publish-model-images:
    name: Publish ${{ matrix.image }}
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: moparse-native-worker
            dockerfile: Dockerfile.native-worker
            smoke: cpu-native
          - image: moparse-mineru-vllm
            dockerfile: Dockerfile.mineru-vllm
            smoke: gpu-sdk-import
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.sha }}

      - name: Make room for the pinned 22 GiB vLLM image on the hosted runner
        if: matrix.smoke == 'gpu-sdk-import'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost
          docker image prune --all --force
          df -h /

      - name: Verify source revision before building dependent images
        env:
          VERIFIED_SHA: ${{ needs.publish.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          main_sha=$(git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/main | cut -f1)
          if [ "$VERIFIED_SHA" != "$main_sha" ]; then
            echo "main advanced before the dependent image build" >&2
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dependent image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/scisaga/${{ matrix.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/Scisaga/moparse
            org.opencontainers.image.revision=${{ needs.publish.outputs.sha }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=sha-${{ needs.publish.outputs.short_sha }}

      - name: Build dependent image and run Dockerfile checks
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          # GPU SDK validation runs in Dockerfile.mineru-vllm's RUN step.
          # Keep that large image only in BuildKit, without a second daemon
          # copy or a temporary Docker-load tar on the hosted runner.
          load: ${{ matrix.smoke == 'cpu-native' }}
          tags: ${{ matrix.image }}:publish-candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Verify CPU worker dependency patch without starting inference
        if: matrix.smoke == 'cpu-native'
        run: |
          docker run --rm --network none --entrypoint python \
            moparse-native-worker:publish-candidate -c '
          import importlib.util
          from native_worker.patch_dependency import PATCHED_SHA256, verify_patch
          assert importlib.util.find_spec("torch") is None, "CPU worker unexpectedly contains torch"
          report = verify_patch()
          assert report["source_sha256"] == PATCHED_SHA256
          print(report)
          '

      - name: Recheck verified main immediately before publishing dependent images
        env:
          VERIFIED_SHA: ${{ needs.publish.outputs.sha }}
        run: |
          main_sha=$(git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/main | cut -f1)
          if [ "$VERIFIED_SHA" != "$main_sha" ]; then
            echo "main advanced while the dependent image was being tested" >&2
            exit 1
          fi

      - name: Push verified dependent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: mode=max
          sbom: true
