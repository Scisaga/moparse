name: moparse

services:
  moparse:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MOPARSE_IMAGE:-${MOSAICPARSE_IMAGE:-ghcr.io/scisaga/moparse:0.5.0}}
    container_name: moparse
    restart: unless-stopped
    init: true
    depends_on:
      glm-ocr:
        condition: service_healthy
        required: false
      glm-ocr-sdk:
        condition: service_healthy
        required: false
      mineru-native:
        condition: service_healthy
        required: false
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/static
      PORT: ${PORT:-12303}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,glm-ocr,glm-ocr-sdk,moparse,mosaicparse}
      DOCLING_DEVICE: cpu
      DOCLING_DO_CELL_MATCHING: "0"
      DOCLING_PDF_BACKEND: pypdfium
      DOCLING_COMPILE_MODELS: ${DOCLING_COMPILE_MODELS:-0}
      DOCLING_LOCAL_ARTIFACTS_PATH: /models/docling
      GLM_OCR_ENABLED: ${GLM_OCR_ENABLED:-0}
      GLM_SDK_ENABLED: ${GLM_SDK_ENABLED:-1}
      GLM_SDK_ORIENTATION_ENABLED: ${GLM_SDK_ORIENTATION_ENABLED:-1}
      NATIVE_PARSER_BACKEND: ${NATIVE_PARSER_BACKEND:-docling}
      MINERU_NATIVE_BASE_URL: ${MINERU_NATIVE_BASE_URL:-http://mineru-native:8010}
    ports:
      - "${PORT:-12303}:${PORT:-12303}"
    volumes:
      - mosaicparse-data:/data
      - docling-models:/models/docling
      - huggingface-cache:/models/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-12303}/health"]
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 5
    stop_grace_period: 30s

  glm-ocr:
    profiles: ["glm", "glm-sdk"]
    image: ${GLM_VLLM_IMAGE:-vllm/vllm-openai:v0.19.1}
    container_name: docling_glm_ocr
    restart: unless-stopped
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,glm-ocr,glm-ocr-sdk,moparse,mosaicparse}
    ports:
      - "${GLM_OCR_BIND_ADDRESS:-127.0.0.1}:${GLM_OCR_HOST_PORT:-8001}:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    command:
      - zai-org/GLM-OCR
      - --port
      - "8000"
      - --served-model-name
      - zai-org/GLM-OCR
      - --dtype
      - ${GLM_DTYPE:-half}
      - --gpu-memory-utilization
      - ${GLM_GPU_MEMORY_UTILIZATION:-0.40}
      - --max-model-len
      - ${GLM_MAX_MODEL_LEN:-16384}
      - --max-num-batched-tokens
      - "8192"
      # GLM uses GPT-J MRoPE pairing; vLLM 0.19.1's fused op uses NeoX pairing.
      # Select native rotary only. Keep CUDA Graphs and other custom ops enabled.
      - --compilation-config
      - '{"custom_ops":["all","-rotary_embedding"]}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GLM_GPU_DEVICE_ID:-1}"]
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 8s
      start_period: 5m
      retries: 10
    stop_grace_period: 1m

  glm-ocr-sdk:
    profiles: ["glm-sdk"]
    build:
      context: .
      dockerfile: Dockerfile.glm-sdk
      args:
        PARSER_IMAGE: ${MOPARSE_IMAGE:-${MOSAICPARSE_IMAGE:-ghcr.io/scisaga/moparse:0.5.0}}
    image: ${GLM_SDK_IMAGE:-docling-glm-ocr-sdk:0.1.5}
    container_name: docling_glm_ocr_sdk
    restart: unless-stopped
    init: true
    depends_on:
      glm-ocr:
        condition: service_healthy
    environment:
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: ${GLM_SDK_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${GLM_SDK_OFFLINE:-0}
      HF_TOKEN: ${HF_TOKEN:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,glm-ocr,glm-ocr-sdk,moparse,mosaicparse}
      GLMOCR_MODE: selfhosted
      GLMOCR_OCR_API_URL: http://glm-ocr:8000/v1/chat/completions
      GLMOCR_OCR_MODEL: zai-org/GLM-OCR
      GLMOCR_LAYOUT_DEVICE: cpu
    volumes:
      - huggingface-cache:/models/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=5)"
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 10
    stop_grace_period: 1m

  mineru-vllm:
    profiles: ["mineru"]
    build:
      context: .
      dockerfile: Dockerfile.mineru-vllm
    image: ${MINERU_VLLM_IMAGE:-ghcr.io/scisaga/moparse-mineru-vllm:0.5.0}
    container_name: moparse-mineru-vllm
    restart: unless-stopped
    init: true
    cpus: 4
    mem_limit: 20g
    shm_size: 2g
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      OMP_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    ports:
      - "127.0.0.1:${MINERU_VLLM_HOST_PORT:-12431}:8000"
    volumes:
      - mineru-models:/models/mineru:ro
    command:
      - /models/mineru/snapshots/08aaea840498d49ce16247b6263196cf02814885
      - --served-model-name
      - mineru2.5-pro
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - half
      # Explicit KV budget overrides utilization-based KV allocation. The
      # utilization value is not a hard limit on all model GPU memory.
      - --gpu-memory-utilization
      - "0.16"
      - --kv-cache-memory-bytes
      - "134217728"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "2048"
      - --limit-mm-per-prompt
      - '{"image":1,"video":0}'
      # CUDA Graphs are required; keep torch.compile as a separate factor.
      # Capture sizes must cover the configured model-request concurrency.
      - --compilation-config
      - '{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,3,4],"max_cudagraph_capture_size":4}'
      - --cudagraph-metrics
      - --logits-processors
      - mineru_vl_utils:MinerULogitsProcessor
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MINERU_GPU_DEVICE_ID:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 20s
      timeout: 8s
      start_period: 5m
      retries: 10
    stop_grace_period: 1m

  mineru-native:
    profiles: ["mineru"]
    build:
      context: .
      dockerfile: Dockerfile.native-worker
    image: ${MINERU_NATIVE_IMAGE:-ghcr.io/scisaga/moparse-native-worker:0.5.0}
    container_name: moparse-native-worker
    restart: unless-stopped
    init: true
    cpus: 8
    mem_limit: 8g
    depends_on:
      mineru-vllm:
        condition: service_healthy
    environment:
      MINERU_HOME: /models/mineru-native
      MINERU_MODEL_SOURCE: local
      MINERU_MODEL_SMALL_BACKEND: onnx
      MINERU_VLM_BASE_URL: http://mineru-vllm:8000
      MINERU_VLM_MODEL: mineru2.5-pro
      MINERU_VLM_CONCURRENCY: "4"
      MINERU_INTER_OP_NUM_THREADS: "1"
      MINERU_INTRA_OP_NUM_THREADS: "8"
      MINERU_PROCESSING_WINDOW_SIZE: ${MINERU_PROCESSING_WINDOW_SIZE:-8}
      MINERU_MALLOC_TRIM: ${MINERU_MALLOC_TRIM:-1}
      MOPARSE_CPU_MFR_BATCH_SIZE: ${MOPARSE_CPU_MFR_BATCH_SIZE:-1}
      NO_PROXY: localhost,127.0.0.1,mineru-vllm
    ports:
      - "127.0.0.1:${MINERU_NATIVE_HOST_PORT:-12432}:8010"
    volumes:
      - mineru-small-models:/models/mineru-native:ro
    # Upstream locks local model reads; keep only its lock directory writable.
    tmpfs:
      - /models/mineru-native/models/.locks:size=4m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8010/ready',timeout=8))['ready']"]
      interval: 20s
      timeout: 12s
      start_period: 5m
      retries: 10
    stop_grace_period: 1m

networks:
  default:
    name: moparse_backend
    external: true

# Physical volume names intentionally survive the project rename.
volumes:
  mosaicparse-data:
    name: mosaicparse-data
  docling-models:
    name: ${DOCLING_MODELS_VOLUME:-mosaicparse-docling-models}
  huggingface-cache:
    name: mosaicparse-huggingface-cache
  mineru-models:
    name: moparse-mineru-models
  mineru-small-models:
    name: moparse-mineru-small-models
