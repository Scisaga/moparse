<text x="725" y="194" text-anchor="end" font-size="18">1 并发</text>
<rect x="740" y="170" width="326.70" height="35" rx="3" fill="#718096"/>
<text x="1076.70" y="194" font-size="18" fill="#718096">5.79</text>
<text x="725" y="260" text-anchor="end" font-size="18">2 并发</text>
<rect x="740" y="236" width="227.71" height="35" rx="3" fill="#2563eb"/>
<text x="977.71" y="260" font-size="18" fill="#2563eb">4.04</text>
<text x="725" y="326" text-anchor="end" font-size="18">3 并发</text>
<rect x="740" y="302" width="195.76" height="35" rx="3" fill="#718096"/>
<text x="945.76" y="326" font-size="18" fill="#718096">3.47</text>
<text x="725" y="392" text-anchor="end" font-size="18">4 并发</text>
<rect x="740" y="368" width="178.75" height="35" rx="3" fill="#718096"/>
<text x="928.75" y="392" font-size="18" fill="#718096">3.17</text>
<text x="35" y="495" font-size="16" fill="#556177">各档自身显存峰值均 3426 MiB；固定验收均 45/46，额外四项均通过。该历史输出仍有 TXT 脚注遗漏。</text>
<text x="35" y="524" font-size="15" fill="#64748b">能耗包含 GLM／TTS 等共享服务及设备基线；这不是模型独占能耗。组件计时不等于完整 HTTP 延迟。</text>
