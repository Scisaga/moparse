<text x="530" y="452" text-anchor="middle" font-size="15" fill="#64748b">245</text>
<text x="120" y="194" text-anchor="end" font-size="18">1 并发</text>
<rect x="135" y="170" width="328.14" height="35" rx="3" fill="#718096"/>
