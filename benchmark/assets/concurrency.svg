<rect x="135" y="302" width="177.81" height="35" rx="3" fill="#718096"/>
<text x="322.81" y="326" font-size="18" fill="#718096">110.29</text>
<text x="120" y="392" text-anchor="end" font-size="18">4 并发</text>
<rect x="135" y="368" width="161.53" height="35" rx="3" fill="#718096"/>
<text x="306.53" y="392" font-size="18" fill="#718096">100.19</text>
<text x="650" y="125" font-size="20" font-weight="700">同时间窗 GPU 1 整卡能耗 · Wh</text>
<path d="M740 155V425" stroke="#e5eaf1"/>
<text x="740" y="452" text-anchor="middle" font-size="15" fill="#64748b">0</text>
